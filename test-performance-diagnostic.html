<!DOCTYPE html>
<html>
<head>
    <title>Performance Diagnostic</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            font-size: 13px;
        }
        h2 { color: #4a90e2; }
        .section {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            margin: 15px 0;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            margin: 3px 0;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .critical { color: #f44; font-weight: bold; }
        .warning { color: #fa0; }
        .good { color: #4f4; }
        .info { color: #4af; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #444;
        }
        th {
            background: #333;
            color: #4a90e2;
        }
        .bar {
            background: #4a90e2;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h2>🔬 Performance Diagnostic Tool</h2>
    
    <div class="section">
        <h3>Current Performance</h3>
        <div class="metric">
            <span>FPS:</span>
            <span id="fps" class="info">-</span>
        </div>
        <div class="metric">
            <span>Frame Time:</span>
            <span id="frame-time">-</span>
        </div>
        <div class="metric">
            <span>Grid Resolution:</span>
            <span id="grid-res" class="info">-</span>
        </div>
        <div class="metric">
            <span>Iterations:</span>
            <span id="iterations" class="info">-</span>
        </div>
        <div class="metric">
            <span>Render Passes/Frame:</span>
            <span id="render-passes" class="critical">-</span>
        </div>
    </div>
    
    <div class="section">
        <h3>Bottleneck Analysis</h3>
        <table>
            <tr>
                <th>Operation</th>
                <th>Time (ms)</th>
                <th>% of Frame</th>
                <th>Calls</th>
            </tr>
            <tbody id="timing-table">
                <tr><td colspan="4">Collecting data...</td></tr>
            </tbody>
        </table>
    </div>
    
    <div class="section">
        <h3>Recommendations</h3>
        <div id="recommendations">
            <p>Analyzing...</p>
        </div>
    </div>
    
    <script type="module">
        import { WebGLContext } from './js/webgl-utils.js';
        import { FluidSimulation3D } from './js/simulation3d.js';
        import { CONFIG } from './js/config.js';
        import { GPUProfiler } from './js/gpu-profiler.js';
        import { PerformanceMonitor } from './js/performance-monitor.js';
        
        // Setup simulation
        const canvas = document.createElement('canvas');
        canvas.width = CONFIG.gridSize.x;
        canvas.height = CONFIG.gridSize.y;
        
        const webglContext = new WebGLContext(canvas);
        const gpuProfiler = new GPUProfiler(webglContext.gl);
        const performanceMonitor = new PerformanceMonitor(gpuProfiler);
        const simulation = new FluidSimulation3D(webglContext, performanceMonitor);
        
        // Calculate render passes
        const gridZ = CONFIG.gridSize.z;
        const iterations = simulation.params.iterations;  // Use simulation params, not CONFIG
        const renderPasses = gridZ * 4 + (gridZ * iterations) + 1;  // advect×2 + div + grad + pressure×iter + render
        
        // Update display
        function updateDisplay() {
            const metrics = performanceMonitor.getMetrics();
            const fps = metrics.fps.current || 0;
            const frameTime = metrics.frame.current || 0;
            
            document.getElementById('fps').textContent = fps.toFixed(1);
            document.getElementById('fps').className = fps > 30 ? 'good' : fps > 15 ? 'warning' : 'critical';
            
            document.getElementById('frame-time').textContent = frameTime.toFixed(2) + ' ms';
            document.getElementById('grid-res').textContent = 
                `${CONFIG.gridSize.x}×${CONFIG.gridSize.y}×${CONFIG.gridSize.z}`;
            document.getElementById('iterations').textContent = iterations;
            document.getElementById('render-passes').textContent = renderPasses.toLocaleString();
            
            // Build timing table
            const tbody = document.getElementById('timing-table');
            const timingData = [
                { name: 'Advect Velocity', time: metrics.advectVelocity?.avg || 0, calls: gridZ },
                { name: 'Advect Dye', time: metrics.advectDye?.avg || 0, calls: gridZ },
                { name: 'Divergence', time: metrics.divergence?.avg || 0, calls: gridZ },
                { name: 'Pressure Solve', time: metrics.pressureSolve?.avg || 0, calls: gridZ * iterations },
                { name: 'Subtract Gradient', time: metrics.subtractGradient?.avg || 0, calls: gridZ },
                { name: 'Render', time: metrics.render?.renderTime || 0, calls: 1 }
            ];
            
            const totalTime = timingData.reduce((sum, d) => sum + d.time, 0);
            
            tbody.innerHTML = timingData
                .sort((a, b) => b.time - a.time)
                .map(d => {
                    const pct = totalTime > 0 ? (d.time / totalTime * 100) : 0;
                    const colorClass = pct > 30 ? 'critical' : pct > 15 ? 'warning' : '';
                    return `
                        <tr>
                            <td>${d.name}</td>
                            <td class="${colorClass}">${d.time.toFixed(2)}</td>
                            <td class="${colorClass}">${pct.toFixed(1)}%</td>
                            <td>${d.calls.toLocaleString()}</td>
                        </tr>
                    `;
                })
                .join('');
            
            // Generate recommendations
            const recommendations = [];
            
            if (fps < 15) {
                recommendations.push(`<div class="critical">❌ CRITICAL: FPS is ${fps.toFixed(1)} (target: 30+)</div>`);
            }
            
            if (renderPasses > 1000) {
                recommendations.push(`<div class="critical">❌ Too many render passes: ${renderPasses.toLocaleString()}</div>`);
                recommendations.push(`<div class="info">💡 Reduce grid resolution or iterations</div>`);
            }
            
            const pressurePct = (metrics.pressureSolve?.avg || 0) / totalTime * 100;
            if (pressurePct > 50) {
                recommendations.push(`<div class="warning">⚠️ Pressure solve is ${pressurePct.toFixed(1)}% of frame time</div>`);
                recommendations.push(`<div class="info">💡 Reduce iterations (current: ${iterations})</div>`);
            }
            
            if (CONFIG.gridSize.x > 64) {
                recommendations.push(`<div class="warning">⚠️ Grid resolution is high: ${CONFIG.gridSize.x}³</div>`);
                recommendations.push(`<div class="info">💡 Try 64³ or 48³ for better performance</div>`);
            }
            
            if (recommendations.length === 0) {
                recommendations.push(`<div class="good">✓ Performance looks acceptable</div>`);
            }
            
            document.getElementById('recommendations').innerHTML = recommendations.join('');
        }
        
        // Animation loop
        function animate() {
            performanceMonitor.startFrame();
            
            simulation.step();
            
            performanceMonitor.endFrame();
            
            requestAnimationFrame(animate);
        }
        
        // Update UI periodically
        setInterval(updateDisplay, 500);
        
        // Start
        animate();
        
        console.log('Diagnostic tool loaded');
        console.log(`Grid: ${CONFIG.gridSize.x}×${CONFIG.gridSize.y}×${CONFIG.gridSize.z}`);
        console.log(`Iterations: ${iterations}`);
        console.log(`Render passes/frame: ${renderPasses.toLocaleString()}`);
    </script>
</body>
</html>
