<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Texture Initialization Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #2a2a2a;
        }
        .test-result.success {
            border-left: 4px solid #4CAF50;
        }
        .test-result.error {
            border-left: 4px solid #f44336;
        }
        .test-result.info {
            border-left: 4px solid #2196F3;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3D Texture Initialization Test</h1>
        <div id="results"></div>
        <canvas id="testCanvas"></canvas>
    </div>

    <script type="module">
        import { WebGLContext } from './js/webgl-utils.js';
        import { CONFIG } from './js/config.js';

        const results = document.getElementById('results');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
            console.log(message);
        }

        function logObject(label, obj) {
            const div = document.createElement('div');
            div.className = 'test-result info';
            div.innerHTML = `<strong>${label}</strong><pre>${JSON.stringify(obj, null, 2)}</pre>`;
            results.appendChild(div);
            console.log(label, obj);
        }

        async function runTests() {
            try {
                log('Starting 3D texture initialization tests...', 'info');
                
                // Test 1: Config verification
                log('✓ Test 1: Config structure', 'success');
                logObject('CONFIG.gridSize', CONFIG.gridSize);
                logObject('CONFIG 3D settings', {
                    renderMode: CONFIG.renderMode,
                    sliceAxis: CONFIG.sliceAxis,
                    sliceDepth: CONFIG.sliceDepth,
                    cameraMode: CONFIG.cameraMode
                });

                // Test 2: WebGL2 context
                const canvas = document.getElementById('testCanvas');
                canvas.width = 128;
                canvas.height = 128;
                
                log('✓ Test 2: Creating WebGL2 context...', 'success');
                const webglContext = new WebGLContext(canvas);
                log('✓ WebGL2 context created successfully', 'success');

                // Test 3: 3D texture creation
                log('✓ Test 3: Creating 3D texture...', 'success');
                const tex3D = webglContext.createTexture3D(
                    CONFIG.gridSize.x,
                    CONFIG.gridSize.y,
                    CONFIG.gridSize.z
                );
                
                if (tex3D) {
                    log('✓ 3D texture created successfully', 'success');
                    const voxels = CONFIG.gridSize.x * CONFIG.gridSize.y * CONFIG.gridSize.z;
                    const mb = (voxels * 16) / (1024 * 1024);
                    log(`  Texture size: ${CONFIG.gridSize.x}×${CONFIG.gridSize.y}×${CONFIG.gridSize.z}`, 'info');
                    log(`  Total voxels: ${(voxels/1000000).toFixed(2)}M`, 'info');
                    log(`  Memory estimate: ${mb.toFixed(1)} MB`, 'info');
                } else {
                    throw new Error('3D texture creation returned null');
                }

                // Test 4: 3D FBO creation
                log('✓ Test 4: Creating 3D FBO...', 'success');
                const fbo3D = webglContext.createFBO3D();
                
                if (fbo3D && fbo3D.fbo && fbo3D.tex) {
                    log('✓ 3D FBO created successfully', 'success');
                    logObject('FBO3D structure', {
                        hasFBO: !!fbo3D.fbo,
                        hasTexture: !!fbo3D.tex,
                        width: fbo3D.width,
                        height: fbo3D.height,
                        depth: fbo3D.depth
                    });
                } else {
                    throw new Error('3D FBO creation failed');
                }

                // Test 5: Layer attachment
                log('✓ Test 5: Testing layer attachment...', 'success');
                const testLayers = [0, 64, 127];
                for (const layer of testLayers) {
                    const success = webglContext.attachTextureLayer(fbo3D.fbo, fbo3D.tex, layer);
                    if (success) {
                        log(`✓ Successfully attached layer ${layer}`, 'success');
                    } else {
                        throw new Error(`Failed to attach layer ${layer}`);
                    }
                }

                // Test 6: Double FBO creation
                log('✓ Test 6: Creating double FBO3D...', 'success');
                const doubleFBO = webglContext.createDoubleFBO3D();
                
                if (doubleFBO && doubleFBO.fbo1 && doubleFBO.fbo2 && typeof doubleFBO.swap === 'function') {
                    log('✓ Double FBO3D created successfully', 'success');
                    logObject('Double FBO3D structure', {
                        hasFBO1: !!doubleFBO.fbo1,
                        hasFBO2: !!doubleFBO.fbo2,
                        hasSwapFunction: typeof doubleFBO.swap === 'function'
                    });
                    
                    // Test swap
                    const before = doubleFBO.fbo1;
                    doubleFBO.swap();
                    const after = doubleFBO.fbo2;
                    if (before === after) {
                        log('✓ Swap function works correctly', 'success');
                    } else {
                        throw new Error('Swap function failed');
                    }
                } else {
                    throw new Error('Double FBO3D creation failed');
                }

                log('', 'info');
                log('🎉 All tests passed! 3D texture system is ready.', 'success');
                log('', 'info');
                log('Next step: Implement 3D shaders (Task 2)', 'info');

            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        runTests();
    </script>
</body>
</html>
