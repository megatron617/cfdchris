<!DOCTYPE html>
<html>
<head>
    <title>GPU Fluid Dynamics</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>GPU Fluid Dynamics</h3>
            <div class="control">
                <label>Iterations: <span id="iter-val">40</span></label>
                <input type="range" id="iterations" min="10" max="80" value="40">
            </div>
            <div class="control">
                <label>Force: <span id="force-val">30</span></label>
                <input type="range" id="force" min="5" max="100" value="30">
            </div>
            <button id="clear">Clear</button>
            <button id="pause">Pause</button>
            <span style="color:#aaa; font-size:12px;">Click and drag to add dye</span>
        </div>
        <div id="canvas-container">
            <canvas id="displayCanvas" width="512" height="512"></canvas>
        </div>
        <div id="info">
            <div>FPS: <span id="fps">0</span></div>
            <div>Grid: 128×128</div>
        </div>
    </div>
    
    <!-- Hidden WebGL canvas -->
    <canvas id="webglCanvas" width="128" height="128" style="display:none;"></canvas>
    
    <!-- Load modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
